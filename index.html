<script type="module">

const camera=new THREE.PerspectiveCamera(42,1,.05,150),target=new THREE.Vector3(),renderer=new THREE.WebGLRenderer({antialias:true});

camera.position.set(2,1.3,4.2);camera.lookAt(target);

function geometry(type){

 const result=weldGeometry(source);
 const check=topology(result);
 if(!check?.closed){result.dispose();throw Error(type+' primitive is not watertight')}

}
function weldGeometry(g){
 const position=g.attributes.position,source=g.index,vertices=[],faces=[],lookup=new Map(),seen=new Set();
 const idFor=n=>{
  const x=position.getX(n),y=position.getY(n),z=position.getZ(n);
  const key=[x,y,z].map(v=>Math.round(v*1e5)).join(',');
  let id=lookup.get(key);
  if(id===undefined){id=vertices.length/3;lookup.set(key,id);vertices.push(x,y,z)}
  return id
 };
 const count=source?source.count:position.count;
 for(let i=0;i+2<count;i+=3){
  const a=idFor(source?source.getX(i):i),b=idFor(source?source.getX(i+1):i+1),c=idFor(source?source.getX(i+2):i+2);
  if(a===b||b===c||c===a)continue;
  const ax=vertices[a*3],ay=vertices[a*3+1],az=vertices[a*3+2],
        ux=vertices[b*3]-ax,uy=vertices[b*3+1]-ay,uz=vertices[b*3+2]-az,
        vx=vertices[c*3]-ax,vy=vertices[c*3+1]-ay,vz=vertices[c*3+2]-az,
        nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
  if(nx*nx+ny*ny+nz*nz<1e-16)continue;
  const key=[a,b,c].sort((x,y)=>x-y).join(',');
  if(seen.has(key))continue;
  seen.add(key);faces.push(a,b,c)
 }

 g.dispose();return result
}
function add(type='sphere'){if(layers.length>=12){message('12 layer limit');return}const obj=new THREE.Mesh(geometry(type),material());obj.userData.type=type;obj.userData.label=type[0].toUpperCase()+type.slice(1)+' '+(layers.length+1);if(layers.length)obj.position.x=.28;scene.add(obj);layers.push(obj);select(obj);scheduleSave();message('Shape added')}
function select(obj){selected=obj;drawLayers();drawGizmo();render()}
function drawLayers(){const root=$('#layers');root.replaceChildren();layers.forEach((obj,i)=>{const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:2px;flex:none';const btn=document.createElement('button');btn.textContent=obj.userData.label||'Layer '+(i+1);btn.classList.toggle('active',obj===selected);btn.onclick=()=>select(obj);const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Remove layer');del.onclick=()=>{checkpoint();scene.remove(obj);layers.splice(i,1);obj.geometry.dispose();obj.material.dispose();if(!layers.length)add();else select(layers[Math.min(i,layers.length-1)]);scheduleSave()};wrap.append(btn,del);root.append(wrap)})}
const gizmo=new THREE.Group();scene.add(gizmo);let gizmoMode='move';
const colors={x:0xff6969,y:0x6fdda0,z:0x74adff};
for(const axis of ['x','y','z']){const direction=new THREE.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0);const arrow=new THREE.ArrowHelper(direction,new THREE.Vector3(),1.15,colors[axis],.18,.1);arrow.userData.kind='move';gizmo.add(arrow);const ring=new THREE.Mesh(new THREE.TorusGeometry(.9,.012,8,64),new THREE.MeshBasicMaterial({color:colors[axis],transparent:true,opacity:.8}));if(axis==='x')ring.rotation.y=Math.PI/2;if(axis==='y')ring.rotation.x=Math.PI/2;ring.userData.kind='rotate';gizmo.add(ring);const box=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:colors[axis]}));box.position.copy(direction.multiplyScalar(1.05));box.userData.kind='scale';gizmo.add(box)}
function drawGizmo(){gizmo.visible=tool==='move'&&!!selected;if(!selected)return;selected.updateMatrixWorld(true);selected.getWorldPosition(gizmo.position);gizmo.scale.setScalar(Math.max(.35,camera.position.distanceTo(gizmo.position)*.25));gizmo.children.forEach(c=>c.visible=c.userData.kind===gizmoMode)}
function setGizmo(mode){gizmoMode=mode;drawGizmo();render()}
function capture(){return {layers:layers.map(o=>({type:o.userData.type,label:o.userData.label,positions:Array.from(o.geometry.attributes.position.array),indices:o.geometry.index?Array.from(o.geometry.index.array):null,position:o.position.toArray(),quaternion:o.quaternion.toArray(),scale:o.scale.toArray()})),selected:Math.max(0,layers.indexOf(selected))}}
function checkpoint(){undoStack.push(capture());if(undoStack.length>12)undoStack.shift()}
function restoreData(data){if(!data?.layers?.length||data.layers.length>12)throw Error('Invalid project');const next=[];for(const entry of data.layers){if(!entry.positions||entry.positions.length>500000||entry.positions.length%3)throw Error('Project too large');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(entry.positions,3));if(entry.indices)g.setIndex(entry.indices);g.computeVertexNormals();g.computeBoundingSphere();const obj=new THREE.Mesh(g,material());obj.userData.type=entry.type;obj.userData.label=entry.label;obj.position.fromArray(entry.position||[0,0,0]);obj.quaternion.fromArray(entry.quaternion||[0,0,0,1]);obj.scale.fromArray(entry.scale||[1,1,1]);next.push(obj)}for(const o of layers){scene.remove(o);o.geometry.dispose();o.material.dispose()}layers=next;for(const o of next)scene.add(o);select(next[Math.min(next.length-1,data.selected||0)]);render()}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(capture()))}catch(e){message('Storage full')}},700)}
function saveProject(){try{const k='mini-clay-project-'+Date.now();localStorage.setItem(k,JSON.stringify(capture()));message('Project saved')}catch(e){message('Could not save project')}}
function listProjects(){const el=$('#projects');el.hidden=!el.hidden;if(el.hidden)return;el.replaceChildren();const keys=Object.keys(localStorage).filter(k=>k.startsWith('mini-clay-project-')).sort().reverse();for(const k of keys){const row=document.createElement('div');row.className='row';const b=document.createElement('button');b.textContent=new Date(Number(k.split('-').pop())).toLocaleString();b.onclick=()=>{try{checkpoint();restoreData(JSON.parse(localStorage.getItem(k)));scheduleSave();el.hidden=true}catch(e){message(e.message)}};const d=document.createElement('button');d.textContent='Delete';d.onclick=()=>{if(confirm('Delete this project?')){localStorage.removeItem(k);listProjects();listProjects()}};row.append(b,d);el.append(row)}if(!keys.length)el.textContent='No saved projects'}
function hit(x,y){if(!selected)return null;const r=renderer.domElement.getBoundingClientRect();pointer.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(selected);return hits.length?selected.worldToLocal(hits[0].point.clone()):null}
function topology(g){const a=g.attributes.position,ix=g.index;if(!ix)return null;const edges=new Map(),neighbors=Array.from({length:a.count},()=>new Set()),faces=[];const key=(u,v)=>u<v?u+','+v:v+','+u;for(let i=0;i<ix.count;i+=3){const f=[ix.getX(i),ix.getX(i+1),ix.getX(i+2)];faces.push(f);for(const [u,v] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]){neighbors[u].add(v);neighbors[v].add(u);const k=key(u,v);let e=edges.get(k);if(!e){e={u,v,faces:[]};edges.set(k,e)}e.faces.push(faces.length-1)}}return {edges,neighbors,faces,key,closed:[...edges.values()].every(e=>e.faces.length===2)}}
function sculpt(x,y){
 const p=hit(x,y);if(!p||!selected)return;
 const g=selected.geometry,a=g.attributes.position,old=Float32Array.from(a.array),dest=new Float32Array(old);
 const top=topology(g),radius=.10+brush*.62,points=[p];
 if(mirror)points.push(new THREE.Vector3(-p.x,p.y,p.z));
 const normals=g.attributes.normal,fall=new Float32Array(a.count);
 const centerNormal=new THREE.Vector3(),tmp=new THREE.Vector3();
 for(let i=0;i<a.count;i++){
  const k=i*3;tmp.set(old[k],old[k+1],old[k+2]);let d=Infinity;
  for(const center of points)d=Math.min(d,tmp.distanceTo(center));
  if(d>=radius)continue;
  fall[i]=Math.pow(1-d/radius,1.4);
  if(tool!=='smooth'&&tool!=='crease')centerNormal.addScaledVector(new THREE.Vector3(normals.getX(i),normals.getY(i),normals.getZ(i)),fall[i])
 }

 if(centerNormal.lengthSq()<.001)centerNormal.set(0,1,0);
 const protectedSet=new Set();
 if(top&&(tool==='smooth'||tool==='crease'))for(const e of top.edges.values())if(e.faces.length!==2){protectedSet.add(e.u);protectedSet.add(e.v)}
 for(let i=0;i<a.count;i++){
  const f=fall[i];if(!f)continue;const k=i*3;
  if(tool==='smooth'||tool==='crease'){
   if(!top||protectedSet.has(i)||top.neighbors[i].size<3)continue;
   const avg=new THREE.Vector3();
   for(const j of top.neighbors[i])avg.set(avg.x+old[j*3],avg.y+old[j*3+1],avg.z+old[j*3+2]);
   avg.multiplyScalar(1/top.neighbors[i].size);
   const delta=avg.sub(new THREE.Vector3(old[k],old[k+1],old[k+2]));
   // Preserve most of the volume, but permit some normal motion to round sharp corners.
   const n=new THREE.Vector3(normals.getX(i),normals.getY(i),normals.getZ(i)).normalize();

   const rate=(tool==='crease'?Math.min(.78,.18+strength*.62):Math.min(.62,.12+strength*.48))*f;
   if(tool==='crease'){

    // Restrict displacement to avoid collapsing nearby thin walls.

   }

  }else{
   const n=new THREE.Vector3(normals.getX(i),normals.getY(i),normals.getZ(i)).normalize();

}
let pullAnchor=null;
function mirrorSeam(g){
 const p=g.attributes.position,epsilon=.018;
 // Vertices on the symmetry plane must remain exactly on x=0.
 for(let i=0;i<p.count;i++)if(Math.abs(p.getX(i))<epsilon*.35)p.setX(i,0);
 p.needsUpdate=true
}
function pullStart(x,y){
 const center=hit(x,y);if(!center||!selected){pullAnchor=null;return}
 const p=selected.geometry.attributes.position,weights=new Float32Array(p.count),reflected=new Float32Array(p.count);
 const radius=.10+brush*.62,other=center.clone();other.x=-other.x;
 for(let i=0;i<p.count;i++){
  const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i));
  const d=v.distanceTo(center),m=v.distanceTo(other);
  if(d<radius)weights[i]=Math.pow(1-d/radius,1.4);
  if(mirror&&m<radius)reflected[i]=Math.pow(1-m/radius,1.4)
 }

}
function pullDrag(dx,dy){
 if(!pullAnchor||pullAnchor.mesh!==selected)return;
 const g=selected.geometry,p=g.attributes.position,rect=canvas.getBoundingClientRect();
 const factor=2*camera.position.distanceTo(target)*Math.tan(camera.fov*Math.PI/360)/Math.max(1,rect.height);
 const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
 const movement=right.multiplyScalar(dx*factor).addScaledVector(up,-dy*factor);
 movement.applyQuaternion(selected.getWorldQuaternion(new THREE.Quaternion()).invert());
 movement.multiplyScalar(.25+strength*1.75).clampLength(0,.12);
 for(let i=0;i<p.count;i++){
  const w=pullAnchor.weights[i],m=mirror?pullAnchor.reflected[i]:0;
  if(!w&&!m)continue;
  const sum=Math.max(w,m),sign=w>=m?1:-1;
  const vx=mirror?movement.x*sign:movement.x;
  let x=p.getX(i)+vx*sum;
  if(mirror&&Math.abs(p.getX(i))<.006)x=0;
  p.setXYZ(i,x,p.getY(i)+movement.y*sum,p.getZ(i)+movement.z*sum)

}
function remesh(){if(!selected)return;const g=selected.geometry,t=topology(g);if(!t||!t.closed){message('Remesh stopped: repair open edges first');return}const a=g.attributes.position,verts=Array.from(a.array),faces=t.faces,split=new Set(),mid=new Map(),out=[];const pt=i=>new THREE.Vector3(verts[i*3],verts[i*3+1],verts[i*3+2]);const base=THREE.MathUtils.clamp(.105+Math.sqrt(faces.length/50000)*.055,.11,.19);const normals=faces.map(([a,b,c])=>pt(b).sub(pt(a)).cross(pt(c).sub(pt(a))).normalize());for(const [k,e] of t.edges){const len=pt(e.u).distanceTo(pt(e.v)),angle=Math.acos(THREE.MathUtils.clamp(normals[e.faces[0]].dot(normals[e.faces[1]]),-1,1));if(len>base*(angle>.4?1.15:1.4))split.add(k)}

function midpoint(u,v){const k=t.key(u,v);if(mid.has(k))return mid.get(k);const A=pt(u),B=pt(v),id=verts.length/3;verts.push((A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2);mid.set(k,id);return id}

if(out.length/3>MAX_FACES){message('Remesh canceled: polygon limit');return}const next=new THREE.BufferGeometry();next.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));next.setIndex(out);if(!topology(next).closed){next.dispose();message('Remesh canceled: topology check');return}next.computeVertexNormals();next.computeBoundingSphere();checkpoint();selected.geometry=next;g.dispose();scheduleSave();render();message('Remeshed: '+out.length/3+' triangles')}
function retopologize(){
 if(!selected)return;
 const old=selected.geometry,t=topology(old);
 if(!t?.closed){message('Retopology requires a closed mesh');return}
 const a=old.attributes.position,points=Float32Array.from(a.array),out=Float32Array.from(points);
 const normals=a.count,neighbors=t.neighbors;
 for(let i=0;i<normals;i++){
  const adjacent=neighbors[i];if(adjacent.size<3)continue;
  const average=new THREE.Vector3();
  for(const j of adjacent)average.add(new THREE.Vector3(points[j*3],points[j*3+1],points[j*3+2]));
  average.multiplyScalar(1/adjacent.size);
  const p=new THREE.Vector3(points[i*3],points[i*3+1],points[i*3+2]);
  const delta=average.sub(p);
  const n=new THREE.Vector3(old.attributes.normal.getX(i),old.attributes.normal.getY(i),old.attributes.normal.getZ(i)).normalize();
  delta.addScaledVector(n,-delta.dot(n));
  delta.clampLength(0,.018).multiplyScalar(.5);
  out[i*3]=p.x+delta.x;out[i*3+1]=p.y+delta.y;out[i*3+2]=p.z+delta.z;
 }
 const next=new THREE.BufferGeometry();
 next.setAttribute('position',new THREE.Float32BufferAttribute(out,3));
 next.setIndex(Array.from(old.index.array));
 if(!topology(next)?.closed){next.dispose();message('Retopology canceled: invalid topology');return}

function repairTJunctions(input){
 // Boolean cutters can leave a vertex inside another triangle's edge.
 // Split that edge in every incident face so both sides share identical topology.
 const pos=input.attributes.position.array,indices=Array.from(input.index.array);
 const verts=pos.length/3,grid=new Map(),cell=.075;
 const cellKey=(x,y,z)=>x+','+y+','+z;
 for(let i=0;i<verts;i++){const k=cellKey(Math.floor(pos[i*3]/cell),Math.floor(pos[i*3+1]/cell),Math.floor(pos[i*3+2]/cell));if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i)}
 const edgeMap=new Map(),key=(a,b)=>a<b?a+','+b:b+','+a;

   if(v===a||v===b)continue;

}
async function fuse(){
 if(layers.length<2){message('Add another shape first');return}
 const button=$('#merge');button.disabled=true;message('Fusing shapes…');
 try{
  localStorage.setItem(BACKUP,JSON.stringify(capture()));
  const {Evaluator,Brush,ADDITION}=await import('https://esm.sh/three-bvh-csg@0.0.16?deps=three@0.170.0');
  let joined=null,lastError='';
  // Boolean operations on coplanar cube faces are numerically unstable.
  // Retry with tiny, deterministic offsets rather than destroying the originals.
  for(const epsilon of [0,.0001,.0006]){
   let combined=null;
   try{
    const evaluator=new Evaluator();evaluator.useGroups=false;evaluator.attributes=['position','normal'];
    for(let i=0;i<layers.length;i++){
     const item=layers[i];item.updateMatrixWorld(true);
     const transformed=item.geometry.clone();transformed.applyMatrix4(item.matrixWorld);
     const raw=transformed.index?transformed.toNonIndexed():transformed.clone();
     transformed.dispose();
     const g=new THREE.BufferGeometry();
     g.setAttribute('position',raw.attributes.position.clone());raw.dispose();
     if(i&&epsilon){
      const p=g.attributes.position;
      for(let j=0;j<p.count;j++)p.setXYZ(j,p.getX(j)+epsilon*i,p.getY(j)+epsilon*i*.47,p.getZ(j)-epsilon*i*.31);
      p.needsUpdate=true
     }
     g.computeVertexNormals();
     const operand=new Brush(g,new THREE.MeshStandardMaterial());
     operand.updateMatrixWorld(true);
     if(!combined){combined=operand;continue}
     const next=evaluator.evaluate(combined,operand,ADDITION);
     combined.geometry.dispose();operand.geometry.dispose();combined=next
    }
    if(!combined?.geometry?.attributes?.position)throw Error('Boolean produced no geometry');
    let candidate=repairTJunctions(weldGeometry(combined.geometry.clone()));
    combined.geometry.dispose();
    const t=topology(candidate);
    const bad=t?[...t.edges.values()].filter(e=>e.faces.length!==2).length:Infinity;
    if(candidate.index.count/3>MAX_FACES){candidate.dispose();throw Error('Polygon safety limit exceeded')}
    if(bad){candidate.dispose();throw Error(bad+' open or non-manifold edges')}
    joined=candidate;break
   }catch(e){lastError=e.message||String(e);if(combined?.geometry)combined.geometry.dispose()}
  }
  if(!joined)throw Error(lastError+' · original layers kept');
  checkpoint();
  const obj=new THREE.Mesh(joined,material());obj.userData.type='merged';obj.userData.label='Fused sculpture';
  for(const item of layers){scene.remove(item);item.geometry.dispose();item.material.dispose()}
  layers=[obj];scene.add(obj);select(obj);scheduleSave();
  message('Fused successfully · '+joined.index.count/3+' triangles');
 }catch(e){message('Fuse failed: '+e.message);console.error('Fuse error',e)}
 finally{button.disabled=false}
}
function postMirror(){
 if(!selected)return;
 const g=selected.geometry,p=g.attributes.position,old=Float32Array.from(p.array),precision=10000,lookup=new Map();
 const key=(x,y,z)=>[x,y,z].map(v=>Math.round(v*precision)).join(',');
 for(let i=0;i<p.count;i++){const k=key(old[i*3],old[i*3+1],old[i*3+2]);lookup.set(k,i)}
 const next=Float32Array.from(old);let paired=0,seam=0;
 // Symmetrize using actual vertex pairs, not nearest unrelated vertices.
 for(let i=0;i<p.count;i++){
  const x=old[i*3],y=old[i*3+1],z=old[i*3+2];
  if(Math.abs(x)<.008){next[i*3]=0;seam++;continue}
  if(x<0)continue;
  let j=lookup.get(key(-x,y,z));
  if(j===undefined){
   // Sculpted counterparts may drift: search a small neighboring spatial grid.
   let best=.025*.025;
   for(let k=0;k<p.count;k++){
    if(old[k*3]>=0)continue;
    const dx=old[k*3]+x,dy=old[k*3+1]-y,dz=old[k*3+2]-z,dist=dx*dx+dy*dy+dz*dz;
    if(dist<best){best=dist;j=k}
   }
  }
  if(j===undefined)continue;
  const mx=(Math.abs(x)+Math.abs(old[j*3]))*.5,my=(y+old[j*3+1])*.5,mz=(z+old[j*3+2])*.5;
  next[i*3]=mx;next[i*3+1]=my;next[i*3+2]=mz;
  next[j*3]=-mx;next[j*3+1]=my;next[j*3+2]=mz;paired++
 }
 checkpoint();p.array.set(next);p.needsUpdate=true;g.computeVertexNormals();g.computeBoundingSphere();render();scheduleSave();
 message('Mirror aligned · '+paired+' pairs · '+seam+' center vertices')
}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101116"><title>Mini Clay</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;color:#eee;font:14px system-ui;overscroll-behavior:none;user-select:none;-webkit-user-select:none}#app{height:100dvh;display:flex;flex-direction:column}header{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700}#stage{flex:1;min-height:150px;position:relative;touch-action:none;overflow:hidden}canvas{display:block;touch-action:none}#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#b7b1ad;pointer-events:none;font-size:12px}#panel{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#1b1d24;border-radius:20px 20px 0 0}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}button{background:#30333d;border:1px solid #494b55;color:#eee;border-radius:12px;padding:13px 5px;font:inherit;touch-action:manipulation}button.active{background:#84654f;border-color:#e3b995}label{display:flex;justify-content:space-between;margin:13px 0 5px}input{width:100%;accent-color:#d2a17b}footer{display:flex;gap:8px;margin-top:12px}footer button{flex:1}#status{font-size:11px;color:#9b9fa9;font-weight:400}
</style></head><body><div id="app"><header><span>◉ Mini Clay</span><span id="status">Loading 3D…</span></header><div id="stage"><div id="hint">Sculpt: drag on clay · Rotate: drag anywhere · Pinch: zoom</div></div><div id="panel"><div class="tools"><button data-tool="add" class="active">＋ Add</button><button data-tool="carve">－ Carve</button><button data-tool="smooth">≈ Smooth</button><button data-tool="rotate">⟳ Rotate</button><button data-tool="pan">✥ Pan</button></div><label>Brush size <output id="sizeval">35</output></label><input id="size" type="range" min="5" max="100" value="35"><label>Strength <output id="strengthval">35</output></label><input id="strength" type="range" min="5" max="100" value="35"><footer><button id="undo">↶ Undo</button><button id="center">⊙ Center</button><button id="reset">● New Sphere</button></footer></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#101116');
const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,0,4.3);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x564135,2.2));
const light=new THREE.DirectionalLight(0xffe6cc,2.5);light.position.set(-3,5,6);scene.add(light);
let mesh,base,history=[],tool='add',brush=.35,strength=.35;const target=new THREE.Vector3();function fitDistance(){const half=THREE.MathUtils.degToRad(camera.fov/2);const horizontal=Math.atan(Math.tan(half)*camera.aspect);return 1.35/Math.sin(Math.min(half,horizontal))}function center(){target.set(0,0,0);camera.position.set(0,0,fitDistance());camera.lookAt(target);mesh.position.set(0,0,0);render()}
function sphere(){if(mesh){scene.remove(mesh);mesh.geometry.dispose()}const geometry=new THREE.SphereGeometry(1.15,96,64);mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xc29a7b,roughness:.95,metalness:0,flatShading:false}));scene.add(mesh);mesh.rotation.set(0,0,0);history=[];base=geometry.attributes.position.array.slice();render()}
function render(){renderer.render(scene,camera)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);if(mesh&&target.lengthSq()===0){camera.position.z=Math.max(camera.position.z,fitDistance())}render()}
new ResizeObserver(resize).observe(stage);sphere();resize();center();status.textContent='Ready';
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),local=new THREE.Vector3();
function hit(x,y){const rect=stage.getBoundingClientRect();pointer.set((x-rect.left)/rect.width*2-1,-((y-rect.top)/rect.height*2-1));raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(mesh);if(!hits.length)return null;return mesh.worldToLocal(hits[0].point.clone())}
function sculpt(x,y){const point=hit(x,y);if(!point)return;const geo=mesh.geometry,attr=geo.attributes.position;const radius=.08+brush*.5;const intensity=.004+strength*.025;const norm=point.clone().normalize();for(let i=0;i<attr.count;i++){local.fromBufferAttribute(attr,i);const dist=local.distanceTo(point);if(dist>radius)continue;const fall=Math.pow(1-dist/radius,2);const outward=local.clone().normalize();if(tool==='smooth'){const target=1.15;local.addScaledVector(outward,(target-local.length())*fall*strength*.09)}else{local.addScaledVector(outward,(tool==='add'?1:-1)*fall*intensity)}attr.setXYZ(i,local.x,local.y,local.z)}attr.needsUpdate=true;geo.computeVertexNormals();geo.computeBoundingSphere();render()}
function save(){history.push(mesh.geometry.attributes.position.array.slice());if(history.length>15)history.shift()}
const active=new Map();let last=null,prevPinch=0;
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(active.size===1&&['add','carve','smooth'].includes(tool)){save();sculpt(e.clientX,e.clientY)}});
canvas.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;e.preventDefault();const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size>=2){const p=[...active.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(prevPinch)camera.position.z=THREE.MathUtils.clamp(camera.position.z*prevPinch/dist,fitDistance()*.55,18);prevPinch=dist;render();return}prevPinch=0;if(tool==='pan'){const distance=camera.position.distanceTo(target);const factor=2*distance*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))/stage.clientHeight;const dx=(e.clientX-old.x)*factor,dy=-(e.clientY-old.y)*factor;camera.position.x-=dx;camera.position.y-=dy;target.x-=dx;target.y-=dy;camera.lookAt(target);render()}else if(tool==='rotate'){mesh.rotation.y+=(e.clientX-old.x)*.009;mesh.rotation.x+=(e.clientY-old.y)*.009;render()}else{const dx=e.clientX-old.x,dy=e.clientY-old.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));for(let i=1;i<=n;i++)sculpt(old.x+dx*i/n,old.y+dy*i/n)}});
function end(e){active.delete(e.pointerId);prevPinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));document.querySelector('#hint').textContent=tool==='rotate'?'Drag to rotate · Pinch to zoom':tool==='pan'?'Drag to pan · Center to reset':'Drag on sphere to '+tool+' · Pinch to zoom'}));
for(const id of ['size','strength'])document.getElementById(id).addEventListener('input',e=>{document.getElementById(id+'val').textContent=e.target.value;if(id==='size')brush=e.target.value/100;else strength=e.target.value/100});
document.querySelector('#undo').onclick=()=>{const arr=history.pop();if(!arr)return;const attr=mesh.geometry.attributes.position;attr.array.set(arr);attr.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere();render()};
document.querySelector('#center').onclick=center;document.querySelector('#reset').onclick=()=>{sphere();center()};
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101116"><title>Mini Clay</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;color:#eee;font:14px system-ui;overscroll-behavior:none;user-select:none;-webkit-user-select:none}#app{height:100dvh;display:flex;flex-direction:column}header{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700}#stage{flex:1;min-height:150px;position:relative;touch-action:none;overflow:hidden}canvas{display:block;touch-action:none;width:100%;height:100%}#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#b7b1ad;pointer-events:none;font-size:12px}#panel{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#1b1d24;border-radius:20px 20px 0 0}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{background:#30333d;border:1px solid #494b55;color:#eee;border-radius:12px;padding:13px 5px;font:inherit;touch-action:manipulation}button.active{background:#84654f;border-color:#e3b995}label{display:flex;justify-content:space-between;margin:13px 0 5px}input{width:100%;accent-color:#d2a17b}footer{display:flex;gap:8px;margin-top:12px}footer button{flex:1}#status{font-size:11px;color:#9b9fa9;font-weight:400}
</style></head><body><div id="app"><header><span>◉ Mini Clay</span><span id="status">Loading 3D…</span></header><div id="stage"><div id="hint">One finger: sculpt · Two: zoom + rotate · Three: pan</div></div><div id="panel"><div class="tools"><button data-tool="add" class="active">＋ Add</button><button data-tool="carve">－ Carve</button><button data-tool="smooth">≈ Smooth</button></div><label style="align-items:center">Dynamic Poly <input id="dyntopo" type="checkbox" checked style="width:22px;height:22px"></label><label>Detail <output id="detailval">50</output></label><input id="detail" type="range" min="10" max="100" value="50"><label>Brush size <output id="sizeval">35</output></label><input id="size" type="range" min="5" max="100" value="35"><label>Strength <output id="strengthval">35</output></label><input id="strength" type="range" min="5" max="100" value="35"><footer><button id="undo">↶ Undo</button><button id="center">⊙ Center</button><button id="reset">● New Sphere</button></footer></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#101116');
const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,0,4.3);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';
scene.add(new THREE.HemisphereLight(0xffffff,0x564135,2.2));
const light=new THREE.DirectionalLight(0xffe6cc,2.5);light.position.set(-3,5,6);scene.add(light);
let mesh,base,history=[],tool='add',brush=.35,strength=.35,detail=.5,dyntopo=true,lastRefine=0;const target=new THREE.Vector3();function fitDistance(){const half=THREE.MathUtils.degToRad(camera.fov/2);const horizontal=Math.atan(Math.tan(half)*camera.aspect);return 1.35/Math.sin(Math.min(half,horizontal))}function center(){target.set(0,0,0);camera.position.set(0,0,fitDistance());camera.lookAt(target);mesh.position.set(0,0,0);resize();render()}
function sphere(){if(mesh){scene.remove(mesh);mesh.geometry.dispose()}const geometry=new THREE.SphereGeometry(1.15,40,28);mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xc29a7b,roughness:.95,metalness:0,flatShading:false}));scene.add(mesh);mesh.rotation.set(0,0,0);history=[];base=geometry.attributes.position.array.slice();updateCount();render()}
function render(){renderer.render(scene,camera)}
function resize(){const rect=stage.getBoundingClientRect();const w=Math.max(1,rect.width),h=Math.max(1,rect.height);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);if(mesh&&target.lengthSq()===0){camera.position.z=Math.max(camera.position.z,fitDistance())}render()}
new ResizeObserver(resize).observe(stage);sphere();resize();center();status.textContent='Ready';
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),local=new THREE.Vector3();
function hit(x,y){const rect=renderer.domElement.getBoundingClientRect();pointer.set(((x-rect.left)/rect.width)*2-1,1-((y-rect.top)/rect.height)*2);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(mesh);if(!hits.length)return null;return mesh.worldToLocal(hits[0].point.clone())}
function sculpt(x,y){const point=hit(x,y);if(!point)return;if(dyntopo&&performance.now()-lastRefine>120){refine(point);lastRefine=performance.now()}const geo=mesh.geometry,attr=geo.attributes.position;const radius=.08+brush*.5;const intensity=.004+strength*.025;const norm=point.clone().normalize();for(let i=0;i<attr.count;i++){local.fromBufferAttribute(attr,i);const dist=local.distanceTo(point);if(dist>radius)continue;const fall=Math.pow(1-dist/radius,2);const outward=local.clone().normalize();if(tool==='smooth'){const target=1.15;local.addScaledVector(outward,(target-local.length())*fall*strength*.09)}else{local.addScaledVector(outward,(tool==='add'?1:-1)*fall*intensity)}attr.setXYZ(i,local.x,local.y,local.z)}attr.needsUpdate=true;geo.computeVertexNormals();geo.computeBoundingSphere();render()}
function updateCount(){const g=mesh.geometry;status.textContent=(g.index?g.index.count/3:g.attributes.position.count/3).toLocaleString()+' polys'}
function refine(point){
const geo=mesh.geometry,attr=geo.attributes.position,idx=geo.index;if(!idx)return;
const ids=idx.array,verts=Array.from(attr.array),newIndices=[],cache=new Map(),maxTris=48000;
if(ids.length/3>=maxTris)return;
const radius=.08+brush*.5,threshold=.13-detail*.095;
function midpoint(a,b){const key=a<b?a+','+b:b+','+a;if(cache.has(key))return cache.get(key);const k=verts.length/3;for(let j=0;j<3;j++)verts.push((verts[a*3+j]+verts[b*3+j])*.5);cache.set(key,k);return k}
let refined=0;
for(let i=0;i<ids.length;i+=3){
const a=ids[i],b=ids[i+1],c=ids[i+2];
const ax=verts[a*3],ay=verts[a*3+1],az=verts[a*3+2],bx=verts[b*3],by=verts[b*3+1],bz=verts[b*3+2],cx=verts[c*3],cy=verts[c*3+1],cz=verts[c*3+2];
const mx=(ax+bx+cx)/3,my=(ay+by+cy)/3,mz=(az+bz+cz)/3;
const near=Math.hypot(mx-point.x,my-point.y,mz-point.z)<radius*1.3;
const edge=Math.max(Math.hypot(ax-bx,ay-by,az-bz),Math.hypot(bx-cx,by-cy,bz-cz),Math.hypot(cx-ax,cy-ay,cz-az));
if(near&&edge>threshold&&ids.length/3+refined*3<maxTris){
const ab=midpoint(a,b),bc=midpoint(b,c),ca=midpoint(c,a);
newIndices.push(a,ab,ca,ab,b,bc,ca,bc,c,ab,bc,ca);refined++;
}else newIndices.push(a,b,c);
}
if(!refined)return;
const next=new THREE.BufferGeometry();
next.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));next.setIndex(newIndices);next.computeVertexNormals();next.computeBoundingSphere();
mesh.geometry=next;geo.dispose();updateCount();
}
function save(){history.push({positions:mesh.geometry.attributes.position.array.slice(),indices:mesh.geometry.index?.array.slice()});if(history.length>10)history.shift()}
const active=new Map();let last=null,prevPinch=0,prevMid=null;
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(active.size>=2){prevPinch=0;prevMid=null}if(active.size===1&&['add','carve','smooth'].includes(tool)){save();sculpt(e.clientX,e.clientY)}});
canvas.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;e.preventDefault();const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size>=3){const p=[...active.values()];const mid={x:p.reduce((sum,v)=>sum+v.x,0)/p.length,y:p.reduce((sum,v)=>sum+v.y,0)/p.length};if(prevMid){const distance=camera.position.distanceTo(target),factor=2*distance*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))/renderer.domElement.getBoundingClientRect().height;const dx=(mid.x-prevMid.x)*factor,dy=-(mid.y-prevMid.y)*factor;camera.position.x-=dx;camera.position.y-=dy;target.x-=dx;target.y-=dy;camera.lookAt(target)}prevMid=mid;prevPinch=0;render();return}if(active.size===2){const p=[...active.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};if(prevPinch){const oldDist=camera.position.distanceTo(target),newDist=THREE.MathUtils.clamp(oldDist*prevPinch/Math.max(dist,1),fitDistance()*.55,18);camera.position.z=target.z+newDist}if(prevMid){mesh.rotation.y+=(mid.x-prevMid.x)*.009;mesh.rotation.x+=(mid.y-prevMid.y)*.009}camera.lookAt(target);prevPinch=dist;prevMid=mid;render();return}prevPinch=0;prevMid=null;if(['add','carve','smooth'].includes(tool)){const dx=e.clientX-old.x,dy=e.clientY-old.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));for(let i=1;i<=n;i++)sculpt(old.x+dx*i/n,old.y+dy*i/n)}});
function end(e){active.delete(e.pointerId);prevPinch=0;prevMid=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));document.querySelector('#hint').textContent='One finger: sculpt · Two: zoom + rotate · Three: pan'}));
document.getElementById('dyntopo').addEventListener('change',e=>{dyntopo=e.target.checked});document.getElementById('detail').addEventListener('input',e=>{detail=e.target.value/100;document.getElementById('detailval').textContent=e.target.value});for(const id of ['size','strength'])document.getElementById(id).addEventListener('input',e=>{document.getElementById(id+'val').textContent=e.target.value;if(id==='size')brush=e.target.value/100;else strength=e.target.value/100});
document.querySelector('#undo').onclick=()=>{const snap=history.pop();if(!snap)return;const old=mesh.geometry;const next=new THREE.BufferGeometry();next.setAttribute('position',new THREE.BufferAttribute(new Float32Array(snap.positions),3));if(snap.indices)next.setIndex(Array.from(snap.indices));next.computeVertexNormals();next.computeBoundingSphere();mesh.geometry=next;old.dispose();updateCount();render()};
document.querySelector('#center').onclick=center;document.querySelector('#reset').onclick=()=>{sphere();center()};
</script></body></html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101116"><title>Mini Clay</title>
<style>

</style></head><body><div id="app"><header><div><h1>◉ Mini Clay</h1><div id="version">Version 2.1.0</div></div><div id="status">Starting…</div></header><main id="stage"><div id="hint">1 finger: sculpt / move · 2: orbit or transform · 3: pan</div></main><section id="panel"><button id="handle">⌄ Tools · Tap to collapse</button>

</section></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const $=s=>document.querySelector(s),stage=$('#stage'),status=$('#status'),scene=new THREE.Scene();
scene.background=new THREE.Color('#101116');
const camera=new THREE.PerspectiveCamera(42,1,.05,150),target=new THREE.Vector3(),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
camera.position.set(2,1.3,4.2);camera.lookAt(target);
scene.add(new THREE.HemisphereLight(0xffffff,0x554438,2.3));
const sun=new THREE.DirectionalLight(0xffe3c8,2.6);sun.position.set(-3,5,6);scene.add(sun);
const grid=new THREE.GridHelper(8,16,0x596276,0x343743);grid.position.y=-1.6;scene.add(grid);
scene.add(new THREE.AxesHelper(2.1));
const material=()=>new THREE.MeshStandardMaterial({color:0xc69c7b,roughness:.9,metalness:0,side:THREE.DoubleSide});
let layers=[],selected=null,tool='add',mirror=false,brush=.35,strength=.35,undoStack=[],saveTimer=null;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),v=new THREE.Vector3(),w=new THREE.Vector3();
const MAX_FACES=60000,KEY='mini-clay-v2-current',BACKUP='mini-clay-v2-before-fuse';
function message(s){status.textContent=s}
function render(){renderer.render(scene,camera)}
function resize(){const r=stage.getBoundingClientRect();camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);render()}
new ResizeObserver(resize).observe(stage);
function geometry(type){
 const source=type==='box'?new THREE.BoxGeometry(1.35,1.35,1.35,12,12,12):
 type==='cylinder'?new THREE.CylinderGeometry(.75,.75,1.5,48,14):
 type==='torus'?new THREE.TorusGeometry(.65,.25,24,72):
 new THREE.SphereGeometry(.9,64,40);
 const result=weldGeometry(source);
 const check=topology(result);
 if(!check?.closed){result.dispose();throw Error(type+' primitive is not watertight')}
 return result
}
function weldGeometry(g){
 const position=g.attributes.position,source=g.index,vertices=[],faces=[],lookup=new Map(),seen=new Set();
 const idFor=n=>{
  const x=position.getX(n),y=position.getY(n),z=position.getZ(n);
  const key=[x,y,z].map(v=>Math.round(v*1e5)).join(',');
  let id=lookup.get(key);
  if(id===undefined){id=vertices.length/3;lookup.set(key,id);vertices.push(x,y,z)}
  return id
 };
 const count=source?source.count:position.count;
 for(let i=0;i+2<count;i+=3){
  const a=idFor(source?source.getX(i):i),b=idFor(source?source.getX(i+1):i+1),c=idFor(source?source.getX(i+2):i+2);
  if(a===b||b===c||c===a)continue;
  const ax=vertices[a*3],ay=vertices[a*3+1],az=vertices[a*3+2],
        ux=vertices[b*3]-ax,uy=vertices[b*3+1]-ay,uz=vertices[b*3+2]-az,
        vx=vertices[c*3]-ax,vy=vertices[c*3+1]-ay,vz=vertices[c*3+2]-az,
        nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
  if(nx*nx+ny*ny+nz*nz<1e-16)continue;
  const key=[a,b,c].sort((x,y)=>x-y).join(',');
  if(seen.has(key))continue;
  seen.add(key);faces.push(a,b,c)
 }
 const result=new THREE.BufferGeometry();
 result.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 result.setIndex(faces);result.computeVertexNormals();result.computeBoundingSphere();
 g.dispose();return result
}
function add(type='sphere'){if(layers.length>=12){message('12 layer limit');return}const obj=new THREE.Mesh(geometry(type),material());obj.userData.type=type;obj.userData.label=type[0].toUpperCase()+type.slice(1)+' '+(layers.length+1);if(layers.length)obj.position.x=.28;scene.add(obj);layers.push(obj);select(obj);scheduleSave();message('Shape added')}
function select(obj){selected=obj;drawLayers();drawGizmo();render()}
function drawLayers(){const root=$('#layers');root.replaceChildren();layers.forEach((obj,i)=>{const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:2px;flex:none';const btn=document.createElement('button');btn.textContent=obj.userData.label||'Layer '+(i+1);btn.classList.toggle('active',obj===selected);btn.onclick=()=>select(obj);const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Remove layer');del.onclick=()=>{checkpoint();scene.remove(obj);layers.splice(i,1);obj.geometry.dispose();obj.material.dispose();if(!layers.length)add();else select(layers[Math.min(i,layers.length-1)]);scheduleSave()};wrap.append(btn,del);root.append(wrap)})}
const gizmo=new THREE.Group();scene.add(gizmo);let gizmoMode='move';
const colors={x:0xff6969,y:0x6fdda0,z:0x74adff};
for(const axis of ['x','y','z']){const direction=new THREE.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0);const arrow=new THREE.ArrowHelper(direction,new THREE.Vector3(),1.15,colors[axis],.18,.1);arrow.userData.kind='move';gizmo.add(arrow);const ring=new THREE.Mesh(new THREE.TorusGeometry(.9,.012,8,64),new THREE.MeshBasicMaterial({color:colors[axis],transparent:true,opacity:.8}));if(axis==='x')ring.rotation.y=Math.PI/2;if(axis==='y')ring.rotation.x=Math.PI/2;ring.userData.kind='rotate';gizmo.add(ring);const box=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:colors[axis]}));box.position.copy(direction.multiplyScalar(1.05));box.userData.kind='scale';gizmo.add(box)}
function drawGizmo(){gizmo.visible=tool==='move'&&!!selected;if(!selected)return;selected.updateMatrixWorld(true);selected.getWorldPosition(gizmo.position);gizmo.scale.setScalar(Math.max(.35,camera.position.distanceTo(gizmo.position)*.25));gizmo.children.forEach(c=>c.visible=c.userData.kind===gizmoMode)}
function setGizmo(mode){gizmoMode=mode;drawGizmo();render()}
function capture(){return {layers:layers.map(o=>({type:o.userData.type,label:o.userData.label,positions:Array.from(o.geometry.attributes.position.array),indices:o.geometry.index?Array.from(o.geometry.index.array):null,position:o.position.toArray(),quaternion:o.quaternion.toArray(),scale:o.scale.toArray()})),selected:Math.max(0,layers.indexOf(selected))}}
function checkpoint(){undoStack.push(capture());if(undoStack.length>12)undoStack.shift()}
function restoreData(data){if(!data?.layers?.length||data.layers.length>12)throw Error('Invalid project');const next=[];for(const entry of data.layers){if(!entry.positions||entry.positions.length>500000||entry.positions.length%3)throw Error('Project too large');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(entry.positions,3));if(entry.indices)g.setIndex(entry.indices);g.computeVertexNormals();g.computeBoundingSphere();const obj=new THREE.Mesh(g,material());obj.userData.type=entry.type;obj.userData.label=entry.label;obj.position.fromArray(entry.position||[0,0,0]);obj.quaternion.fromArray(entry.quaternion||[0,0,0,1]);obj.scale.fromArray(entry.scale||[1,1,1]);next.push(obj)}for(const o of layers){scene.remove(o);o.geometry.dispose();o.material.dispose()}layers=next;for(const o of next)scene.add(o);select(next[Math.min(next.length-1,data.selected||0)]);render()}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(capture()))}catch(e){message('Storage full')}},700)}
function saveProject(){try{const k='mini-clay-project-'+Date.now();localStorage.setItem(k,JSON.stringify(capture()));message('Project saved')}catch(e){message('Could not save project')}}
function listProjects(){const el=$('#projects');el.hidden=!el.hidden;if(el.hidden)return;el.replaceChildren();const keys=Object.keys(localStorage).filter(k=>k.startsWith('mini-clay-project-')).sort().reverse();for(const k of keys){const row=document.createElement('div');row.className='row';const b=document.createElement('button');b.textContent=new Date(Number(k.split('-').pop())).toLocaleString();b.onclick=()=>{try{checkpoint();restoreData(JSON.parse(localStorage.getItem(k)));scheduleSave();el.hidden=true}catch(e){message(e.message)}};const d=document.createElement('button');d.textContent='Delete';d.onclick=()=>{if(confirm('Delete this project?')){localStorage.removeItem(k);listProjects();listProjects()}};row.append(b,d);el.append(row)}if(!keys.length)el.textContent='No saved projects'}
function hit(x,y){if(!selected)return null;const r=renderer.domElement.getBoundingClientRect();pointer.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(selected);return hits.length?selected.worldToLocal(hits[0].point.clone()):null}
function topology(g){const a=g.attributes.position,ix=g.index;if(!ix)return null;const edges=new Map(),neighbors=Array.from({length:a.count},()=>new Set()),faces=[];const key=(u,v)=>u<v?u+','+v:v+','+u;for(let i=0;i<ix.count;i+=3){const f=[ix.getX(i),ix.getX(i+1),ix.getX(i+2)];faces.push(f);for(const [u,v] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]){neighbors[u].add(v);neighbors[v].add(u);const k=key(u,v);let e=edges.get(k);if(!e){e={u,v,faces:[]};edges.set(k,e)}e.faces.push(faces.length-1)}}return {edges,neighbors,faces,key,closed:[...edges.values()].every(e=>e.faces.length===2)}}
function sculpt(x,y){const p=hit(x,y);if(!p)return;const g=selected.geometry,a=g.attributes.position,top=topology(g),radius=.08+brush*.5;const normals=g.attributes.normal;const old=Float32Array.from(a.array),dest=new Float32Array(old);const points=[p];if(mirror)points.push(new THREE.Vector3(-p.x,p.y,p.z));const falloff=i=>{const pos=new THREE.Vector3(old[i*3],old[i*3+1],old[i*3+2]);let d=Infinity;for(const center of points)d=Math.min(d,pos.distanceTo(center));return d>=radius?0:Math.pow(1-d/radius,2)};
let protectedSet=new Set();if(top&&tool==='smooth'){for(const e of top.edges.values())if(e.faces.length!==2){protectedSet.add(e.u);protectedSet.add(e.v)}const ring=new Set(protectedSet);for(const i of protectedSet)for(const j of top.neighbors[i])ring.add(j);protectedSet=ring}
for(let i=0;i<a.count;i++){const f=falloff(i);if(!f)continue;const k=i*3;if(tool==='smooth'){if(!top||protectedSet.has(i)||top.neighbors[i].size<3)continue;const avg=new THREE.Vector3();for(const j of top.neighbors[i])avg.add(new THREE.Vector3(old[j*3],old[j*3+1],old[j*3+2]));avg.multiplyScalar(1/top.neighbors[i].size);const delta=avg.sub(new THREE.Vector3(old[k],old[k+1],old[k+2]));const n=new THREE.Vector3(normals.getX(i),normals.getY(i),normals.getZ(i));delta.addScaledVector(n,-delta.dot(n));for(let j=0;j<3;j++)dest[k+j]+=delta.getComponent(j)*f*strength*.055}else{const sign=tool==='add'?1:-1;const n=new THREE.Vector3(normals.getX(i),normals.getY(i),normals.getZ(i)).normalize();for(let j=0;j<3;j++)dest[k+j]+=n.getComponent(j)*sign*f*(.0015+strength*.006)}}a.array.set(dest);a.needsUpdate=true;g.computeVertexNormals();g.computeBoundingSphere();render();scheduleSave()}
function remesh(){if(!selected)return;const g=selected.geometry,t=topology(g);if(!t||!t.closed){message('Remesh stopped: repair open edges first');return}const a=g.attributes.position,verts=Array.from(a.array),faces=t.faces,split=new Set(),mid=new Map(),out=[];const pt=i=>new THREE.Vector3(verts[i*3],verts[i*3+1],verts[i*3+2]);const base=THREE.MathUtils.clamp(.22+Math.sqrt(faces.length/50000)*.07,.2,.34);const normals=faces.map(([a,b,c])=>pt(b).sub(pt(a)).cross(pt(c).sub(pt(a))).normalize());for(const [k,e] of t.edges){const len=pt(e.u).distanceTo(pt(e.v)),angle=Math.acos(THREE.MathUtils.clamp(normals[e.faces[0]].dot(normals[e.faces[1]]),-1,1));if(len>base*(angle>.4?1.15:1.5))split.add(k)}
if(!split.size){message('Detail already sufficient');return}
function midpoint(u,v){const k=t.key(u,v);if(mid.has(k))return mid.get(k);const A=pt(u),B=pt(v),id=verts.length/3;verts.push((A.x+B.x)/2,(A.y+B.y)/2,(A.z+B.z)/2);mid.set(k,id);return id}
for(const [a,b,c] of faces){const ab=split.has(t.key(a,b))?midpoint(a,b):-1,bc=split.has(t.key(b,c))?midpoint(b,c):-1,ca=split.has(t.key(c,a))?midpoint(c,a):-1;const n=(ab>=0)+(bc>=0)+(ca>=0);if(!n)out.push(a,b,c);else if(n===1){if(ab>=0)out.push(a,ab,c,ab,b,c);else if(bc>=0)out.push(b,bc,a,bc,c,a);else out.push(c,ca,b,ca,a,b)}else if(n===2){if(ab<0)out.push(c,ca,bc,ca,a,b,ca,b,bc);else if(bc<0)out.push(a,ab,ca,ab,b,c,ab,c,ca);else out.push(b,bc,ab,bc,c,a,bc,a,ab)}else out.push(a,ab,ca,ab,b,bc,ca,bc,c,ab,bc,ca)}
if(out.length/3>MAX_FACES){message('Remesh canceled: polygon limit');return}const next=new THREE.BufferGeometry();next.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));next.setIndex(out);if(!topology(next).closed){next.dispose();message('Remesh canceled: topology check');return}next.computeVertexNormals();next.computeBoundingSphere();checkpoint();selected.geometry=next;g.dispose();scheduleSave();render();message('Remeshed: '+out.length/3+' triangles')}
async function fuse(){if(layers.length<2){message('Add another shape first');return}const button=$('#merge');button.disabled=true;message('Fusing…');try{localStorage.setItem(BACKUP,JSON.stringify(capture()));const {Evaluator,Brush,ADDITION}=await import('https://esm.sh/three-bvh-csg@0.0.16?deps=three@0.170.0');const evaluator=new Evaluator();evaluator.useGroups=false;evaluator.attributes=['position','normal'];let result=null;for(const obj of layers){obj.updateMatrixWorld(true);const g=obj.geometry.clone();g.applyMatrix4(obj.matrixWorld);g.computeVertexNormals();const operand=new Brush(g,material());operand.updateMatrixWorld();if(!result){result=operand;continue}const next=evaluator.evaluate(result,operand,ADDITION);result.geometry.dispose();operand.geometry.dispose();result=next}
const joined=weldGeometry(result.geometry.clone());const t=topology(joined);if(!t||!t.closed){joined.dispose();throw Error('Union has open edges; original shapes preserved')}if(joined.index.count/3>MAX_FACES){joined.dispose();throw Error('Too many triangles')}checkpoint();const obj=new THREE.Mesh(joined,material());obj.userData.type='merged';obj.userData.label='Fused sculpture';for(const o of layers){scene.remove(o);o.geometry.dispose();o.material.dispose()}layers=[obj];scene.add(obj);select(obj);scheduleSave();message('Fusion complete · backup saved')}catch(e){message('Fuse failed: '+e.message);console.error(e)}finally{button.disabled=false}}
function postMirror(){if(!selected)return;checkpoint();const a=selected.geometry.attributes.position,pts=Array.from({length:a.count},(_,i)=>new THREE.Vector3(a.getX(i),a.getY(i),a.getZ(i)));for(let i=0;i<a.count;i++){const p=pts[i];if(p.x>=0)continue;let best=Infinity,match=null;for(const q of pts){if(q.x<0)continue;const d=(q.x+p.x)**2+(q.y-p.y)**2+(q.z-p.z)**2;if(d<best){best=d;match=q}}if(match&&best<.015){a.setXYZ(i,-match.x,match.y,match.z)}}a.needsUpdate=true;selected.geometry.computeVertexNormals();render();scheduleSave()}
function center(){target.set(0,0,0);camera.position.set(2,1.3,4.2);camera.lookAt(target);drawGizmo();render()}
const touches=new Map();let previous=null,gesture=null,started=false;
const canvas=renderer.domElement;
function pointEvent(e){return {x:e.clientX,y:e.clientY}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,pointEvent(e));previous=null;gesture=null;started=false;if(touches.size===1&&tool!=='move'){checkpoint();sculpt(e.clientX,e.clientY)}});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;e.preventDefault();const before=touches.get(e.pointerId);touches.set(e.pointerId,pointEvent(e));const p=[...touches.values()];if(p.length===1){if(tool!=='move'){sculpt(e.clientX,e.clientY);return}if(!selected)return;if(!started){checkpoint();started=true}const rect=canvas.getBoundingClientRect(),factor=2*camera.position.distanceTo(target)*Math.tan(camera.fov*Math.PI/360)/rect.height;const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);selected.position.addScaledVector(right,(e.clientX-before.x)*factor).addScaledVector(up,-(e.clientY-before.y)*factor);drawGizmo();render();scheduleSave();return}
const mid={x:p.reduce((s,q)=>s+q.x,0)/p.length,y:p.reduce((s,q)=>s+q.y,0)/p.length};if(p.length>=3){if(previous){const scale=camera.position.distanceTo(target)*.002;const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);const shift=right.multiplyScalar(-(mid.x-previous.mid.x)*scale).addScaledVector(up,(mid.y-previous.mid.y)*scale);target.add(shift);camera.position.add(shift);camera.lookAt(target)}previous={mid};drawGizmo();render();return}
const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),angle=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x);
if(!previous){previous={mid,dist,angle,startDist:dist,startMid:mid};return}
const dx=mid.x-previous.mid.x,dy=mid.y-previous.mid.y,ratio=dist/Math.max(1,previous.dist);
if(tool==='move'&&selected){if(!gesture){const pinch=Math.abs(Math.log(dist/previous.startDist))*120,pan=Math.hypot(mid.x-previous.startMid.x,mid.y-previous.startMid.y);if(Math.max(pinch,pan)>9){gesture=pinch>pan*1.2?'scale':'rotate';checkpoint();setGizmo(gesture)}}if(gesture==='scale'){selected.scale.multiplyScalar(THREE.MathUtils.clamp(ratio,.94,1.06));selected.scale.clampScalar(.12,8);scheduleSave()}else if(gesture==='rotate'){selected.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dx*.008));const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);selected.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(right,dy*.008));scheduleSave()}}else{const offset=camera.position.clone().sub(target),radius=THREE.MathUtils.clamp(offset.length()/THREE.MathUtils.clamp(ratio,.8,1.2),1.2,18),theta=Math.atan2(offset.x,offset.z)-dx*.008,phi=THREE.MathUtils.clamp(Math.acos(THREE.MathUtils.clamp(offset.y/offset.length(),-1,1))-dy*.008,.12,Math.PI-.12);camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}
previous={...previous,mid,dist,angle};drawGizmo();render()});

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));setGizmo('move');message(tool==='move'?'Move: 1 finger translate · 2 rotate/scale':'Sculpt mode')});
$('#handle').onclick=()=>{$('#panel').classList.toggle('closed');$('#handle').textContent=$('#panel').classList.contains('closed')?'⌃ Tools · Tap to expand':'⌄ Tools · Tap to collapse'};
$('#mirror').onclick=()=>{mirror=!mirror;$('#mirror').textContent='⇄ Mirror: '+(mirror?'On':'Off')};
$('#postmirror').onclick=postMirror;$('#addshape').onclick=()=>add($('#shape').value);$('#merge').onclick=fuse;$('#remesh').onclick=remesh;
for(const [id,output,set] of [['size','sizeout',x=>brush=x],['strength','strengthout',x=>strength=x]]){$('#'+id).oninput=e=>{const n=Number(e.target.value);set(n/100);$('#'+output).textContent=n}}
$('#undo').onclick=()=>{if(!undoStack.length){message('Nothing to undo');return}const data=undoStack.pop();restoreData(data);scheduleSave();message('Undone')};
$('#center').onclick=center;$('#new').onclick=()=>{if(!confirm('Start a new sculpture?'))return;checkpoint();for(const o of layers){scene.remove(o);o.geometry.dispose();o.material.dispose()}layers=[];add('sphere');center()};
$('#save').onclick=saveProject;$('#projectsbtn').onclick=listProjects;$('#backup').onclick=()=>{const raw=localStorage.getItem(BACKUP);if(!raw){message('No fuse backup available');return}if(confirm('Restore the layers from before your last fusion?')){checkpoint();restoreData(JSON.parse(raw));scheduleSave();message('Fusion backup restored')}};
try{const raw=localStorage.getItem(KEY)||localStorage.getItem('mini-clay-current');if(raw){const data=JSON.parse(raw);if(data.layers?.length){if(data.layers[0].translation&&!data.layers[0].position){for(const item of data.layers){item.position=item.translation;item.quaternion=new THREE.Quaternion().setFromEuler(new THREE.Euler(...(item.rotation||[0,0,0]))).toArray()}}restoreData(data)}else add()}else add()}catch(e){console.error(e);add();message('New sculpture ready')}
center();resize();message('Ready · v2.1.0');
</script></body></html>
